name: Auto Add UDID & Resign IPA

on:
  workflow_dispatch:
    inputs:
      app_key:
        description: "应用标识（对应 base Release 中的 <app_key>.ipa）"
        required: true
        default: "app_hga"
      udid:
        description: "新测试机 UDID（留空则仅用当前已有设备重签）"
        required: false
        default: ""
      strip_extensions:
        description: "是否剥离推送/小组件扩展（有推送扩展请选 false）"
        required: false
        default: "false"
  repository_dispatch:
    types: [resign]

# 全局排队锁：多人同时扫码时依次执行，防止苹果 API 409 冲突与 git push 覆盖
concurrency:
  group: ota-global-resign-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install zsign v1.1.3 & Python deps
        run: |
          sudo apt-get update && sudo apt-get install -y gcc g++ pkg-config libssl-dev zlib1g-dev
          git clone --depth 1 --branch v1.1.3 https://github.com/zhlynn/zsign.git /tmp/zsign
          # 官方 Linux 构建入口；自行扫源码会误编 Windows 专用的 minizip/iowin32.c
          cd /tmp/zsign/build/linux
          make clean
          make -j$(nproc) CXX="g++ -include cstdint"
          sudo install -m 755 /tmp/zsign/bin/zsign /usr/local/bin/zsign
          zsign -v || true
          # 2025-05 起 runner 镜像移除了 pip 豁免，裸 pip 会报 externally-managed-environment
          pip install --break-system-packages PyJWT cryptography requests

      - name: Decode certs & download base IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASC_P8_BASE64: ${{ secrets.ASC_P8_BASE64 }}
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          APP_KEY: ${{ github.event.inputs.app_key || github.event.client_payload.app_key || 'app_hga' }}
        run: |
          echo "$ASC_P8_BASE64" | base64 -d > /tmp/AuthKey.p8
          echo "$P12_BASE64" | base64 -d > /tmp/dist.p12
          gh release download base -p "${APP_KEY}.ipa" -O "/tmp/${APP_KEY}.ipa"

      - name: Register UDID & Resign IPA
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_KEY: ${{ github.event.inputs.app_key || github.event.client_payload.app_key || 'app_hga' }}
          TARGET_UDID: ${{ github.event.inputs.udid || github.event.client_payload.udid || '' }}
          STRIP_EXTENSIONS: ${{ github.event.inputs.strip_extensions || github.event.client_payload.strip_extensions || 'false' }}
          ENROLL_BASE: ${{ vars.ENROLL_BASE }}
        run: python3 scripts/resign.py

      - name: Publish signed IPA to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_KEY: ${{ github.event.inputs.app_key || github.event.client_payload.app_key || 'app_hga' }}
        run: |
          gh release view signed >/dev/null 2>&1 || gh release create signed --title "Signed IPAs" --notes "Auto resigned IPAs"
          gh release upload signed "/tmp/${APP_KEY}_signed.ipa" --clobber

      - name: Update GitHub Pages manifest & install page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 先提交本地 docs 改动再 rebase，避免脏工作区导致并发时 cannot pull with rebase
          git add docs/
          git diff --cached --quiet || git commit -m "chore: update OTA manifest"
          git pull --rebase --autostash origin main
          git push
